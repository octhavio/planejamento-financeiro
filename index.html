<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeção de Carteira de Investimento</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Área do Gráfico - Lado Esquerdo */
        .chart-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .chart-section h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 400px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .summary-card {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .summary-card .label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .summary-card.highlight {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .summary-card.highlight .value {
            color: #00ff88;
        }

        .summary-card .comparison {
            font-size: 0.75rem;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .summary-card .comparison.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .summary-card .comparison.warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .summary-card .comparison.danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        /* Painel de Configuração - Lado Direito */
        .config-section {
            width: 380px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            overflow-y: auto;
        }

        .config-section h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .config-group {
            margin-bottom: 28px;
        }

        .config-group h3 {
            font-size: 1rem;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 6px;
        }

        .form-field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-field input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .form-field input:disabled {
            background: rgba(255, 255, 255, 0.02);
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.3);
            cursor: not-allowed;
        }

        .form-field .input-suffix {
            position: relative;
        }

        .form-field .input-suffix input {
            padding-right: 50px;
        }

        .form-field .input-suffix::after {
            content: attr(data-suffix);
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.9rem;
        }

        .form-field .input-prefix {
            position: relative;
        }

        .form-field .input-prefix input {
            padding-left: 40px;
        }

        .form-field .input-prefix::before {
            content: 'R$';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.9rem;
        }

        .btn-calculate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        .config-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .config-header h2 {
            margin-bottom: 0;
        }

        .btn-save-icon {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.4);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .btn-save-icon:hover {
            background: rgba(0, 255, 136, 0.3);
            transform: scale(1.05);
        }

        .saved-info {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .saved-info.visible {
            color: #00ff88;
        }

        .chart-options {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }

        .chart-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #888;
            cursor: pointer;
        }

        .chart-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ffa500;
            cursor: pointer;
        }

        .chart-option:hover {
            color: #ccc;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .config-section {
                width: 100%;
            }

            .summary-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Seção do Gráfico -->
        <div class="chart-section">
            <h2>📈 Projeção de Patrimônio Real (descontando inflação)</h2>
            <div class="saved-info" id="savedInfo"></div>
            <div class="chart-options">
                <label class="chart-option">
                    <input type="checkbox" id="showNominal" onchange="calculateProjection()">
                    Mostrar Patrimônio Nominal
                </label>
            </div>
            <div class="chart-container">
                <canvas id="investmentChart"></canvas>
            </div>
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="label" id="labelTotalInvested">Total Aportado aos 65 anos</div>
                    <div class="value" id="totalInvested">R$ 0</div>
                </div>
                <div class="summary-card" id="cardWithdrawal">
                    <div class="label">Retirada Mensal após Aposentadoria</div>
                    <div class="value" id="monthlyWithdrawal">R$ 0</div>
                    <div class="comparison" id="incomeComparison"></div>
                </div>
                <div class="summary-card highlight">
                    <div class="label" id="labelFinalBalance">Patrimônio Final aos 65 anos</div>
                    <div class="value" id="finalBalance">R$ 0</div>
                </div>
            </div>
        </div>

        <!-- Painel de Configuração -->
        <div class="config-section">
            <div class="config-header">
                <h2>⚙️ Configurações</h2>
                <button class="btn-save-icon" onclick="saveConfig()" title="Salvar configuração">💾</button>
            </div>

            <div class="config-group">
                <h3>Dados Pessoais</h3>

                <div class="form-field">
                    <label for="currentAge">Idade Atual</label>
                    <div class="input-suffix" data-suffix="anos">
                        <input type="number" id="currentAge" value="36" min="18" max="100">
                    </div>
                </div>

                <div class="form-field">
                    <label for="retirementAge">Idade de Aposentadoria</label>
                    <div class="input-suffix" data-suffix="anos">
                        <input type="number" id="retirementAge" value="60" min="18" max="100">
                    </div>
                </div>

                <div class="form-field">
                    <label for="desiredIncome">Renda Mensal Desejada</label>
                    <div class="input-prefix">
                        <input type="number" id="desiredIncome" value="18000" min="0" step="100">
                    </div>
                </div>

                <div class="form-field">
                    <label for="monthlyInvestment">Investimento Mensal (Aporte)</label>
                    <div class="input-prefix">
                        <input type="number" id="monthlyInvestment" value="5000" min="0" step="100">
                    </div>
                </div>

                <div class="form-field">
                    <label for="initialBalance">Patrimônio Inicial</label>
                    <div class="input-prefix">
                        <input type="number" id="initialBalance" value="0" min="0" step="1000">
                    </div>
                </div>
            </div>

            <div class="config-group">
                <h3>Configuração de Taxas</h3>

                <div class="form-field">
                    <label for="inflationRate">Inflação Média Anual</label>
                    <div class="input-suffix" data-suffix="%">
                        <input type="number" id="inflationRate" value="6" min="0" max="100" step="0.1">
                    </div>
                </div>

                <div class="form-field">
                    <label for="annualReturn">Rentabilidade Anual</label>
                    <div class="input-suffix" data-suffix="%">
                        <input type="number" id="annualReturn" value="12" min="0" max="100" step="0.1">
                    </div>
                </div>

                <div class="form-field">
                    <label for="realReturn">Rentabilidade Real</label>
                    <div class="input-suffix" data-suffix="%">
                        <input type="number" id="realReturn" value="4" disabled>
                    </div>
                </div>
            </div>

            <div class="config-group">
                <h3>Aposentadoria</h3>

                <div class="form-field">
                    <label for="withdrawalRate">Taxa de Retirada Anual</label>
                    <div class="input-suffix" data-suffix="%">
                        <input type="number" id="withdrawalRate" value="5" min="0" max="100" step="0.1">
                    </div>
                </div>
            </div>

            <button class="btn-calculate" onclick="saveConfig()">
                💾 Calcular e Salvar
            </button>
        </div>
    </div>

    <script>
        let chart = null;
        const STORAGE_KEY = 'investmentProjectionConfig';

        // Formatar data no formato brasileiro
        function formatDate(date) {
            const d = new Date(date);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Salvar configuração no localStorage
        function saveConfig() {
            const config = {
                currentAge: document.getElementById('currentAge').value,
                retirementAge: document.getElementById('retirementAge').value,
                desiredIncome: document.getElementById('desiredIncome').value,
                monthlyInvestment: document.getElementById('monthlyInvestment').value,
                initialBalance: document.getElementById('initialBalance').value,
                inflationRate: document.getElementById('inflationRate').value,
                annualReturn: document.getElementById('annualReturn').value,
                withdrawalRate: document.getElementById('withdrawalRate').value,
                savedAt: new Date().toISOString()
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            updateSavedInfo(config.savedAt);
            calculateProjection();
        }

        // Carregar configuração do localStorage
        function loadConfig() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('currentAge').value = config.currentAge;
                document.getElementById('retirementAge').value = config.retirementAge;
                document.getElementById('desiredIncome').value = config.desiredIncome;
                document.getElementById('monthlyInvestment').value = config.monthlyInvestment;
                document.getElementById('initialBalance').value = config.initialBalance || 0;
                document.getElementById('inflationRate').value = config.inflationRate;
                document.getElementById('annualReturn').value = config.annualReturn;
                document.getElementById('withdrawalRate').value = config.withdrawalRate;
                updateSavedInfo(config.savedAt);
                return true;
            }
            return false;
        }

        // Atualizar informação de quando foi salvo
        function updateSavedInfo(savedAt) {
            const el = document.getElementById('savedInfo');
            el.textContent = `Configuração salva em ${formatDate(savedAt)}`;
            el.classList.add('visible');
        }

        // Formatar valores em Real brasileiro
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(value);
        }

        // Atualizar rentabilidade real quando inflação ou rentabilidade mudam
        function updateRealReturn() {
            const inflation = parseFloat(document.getElementById('inflationRate').value) || 0;
            const annualReturn = parseFloat(document.getElementById('annualReturn').value) || 0;
            const realReturn = annualReturn - inflation;
            document.getElementById('realReturn').value = realReturn.toFixed(2);
        }

        // Calcular projeção de investimento
        function calculateProjection() {
            const currentAge = parseInt(document.getElementById('currentAge').value) || 25;
            const retirementAge = parseInt(document.getElementById('retirementAge').value) || 65;
            const monthlyInvestment = parseFloat(document.getElementById('monthlyInvestment').value) || 0;
            const initialBalance = parseFloat(document.getElementById('initialBalance').value) || 0;
            const annualReturn = parseFloat(document.getElementById('annualReturn').value) / 100 || 0;
            const inflation = parseFloat(document.getElementById('inflationRate').value) / 100 || 0;
            const withdrawalRate = parseFloat(document.getElementById('withdrawalRate').value) / 100 || 0;

            const yearsToRetirement = retirementAge - currentAge;
            if (yearsToRetirement <= 0) {
                alert('A idade de aposentadoria deve ser maior que a idade atual!');
                return;
            }

            const finalAge = 100;
            const totalYears = finalAge - currentAge;

            // Usar rentabilidade REAL (já descontando inflação)
            const realRate = annualReturn - inflation;
            const monthlyRealRate = realRate / 12;
            const monthlyNominalRate = annualReturn / 12;

            const labels = [];
            const balanceData = [];
            const nominalData = [];
            const investedData = [];

            let balance = initialBalance;
            let nominalBalance = initialBalance;
            let totalInvested = 0;
            let balanceAtRetirement = 0;

            // Fase de acumulação (até aposentadoria)
            for (let year = 0; year <= yearsToRetirement; year++) {
                labels.push(currentAge + year);

                if (year === 0) {
                    balanceData.push(initialBalance);
                    nominalData.push(initialBalance);
                    investedData.push(0);
                } else {
                    // Calcular 12 meses de aportes e rendimentos com taxa real
                    for (let month = 0; month < 12; month++) {
                        balance = balance * (1 + monthlyRealRate) + monthlyInvestment;
                        nominalBalance = nominalBalance * (1 + monthlyNominalRate) + monthlyInvestment;
                        totalInvested += monthlyInvestment;
                    }
                    balanceData.push(balance);
                    nominalData.push(nominalBalance);
                    investedData.push(totalInvested);
                }
            }

            balanceAtRetirement = balance;

            // Fase de aposentadoria (após aposentadoria até 100 anos)
            // Sem novos aportes, com retiradas anuais baseadas na taxa configurada
            for (let year = yearsToRetirement + 1; year <= totalYears; year++) {
                labels.push(currentAge + year);

                // Retirada anual baseada no patrimônio no início do ano
                const annualWithdrawal = balance * withdrawalRate;
                const nominalAnnualWithdrawal = nominalBalance * withdrawalRate;

                // Calcular rendimento do ano (já descontando inflação)
                // e descontar a retirada (distribuída ao longo do ano)
                const monthlyWithdrawal = annualWithdrawal / 12;
                const nominalMonthlyWithdrawal = nominalAnnualWithdrawal / 12;

                for (let month = 0; month < 12; month++) {
                    balance = balance * (1 + monthlyRealRate) - monthlyWithdrawal;
                    nominalBalance = nominalBalance * (1 + monthlyNominalRate) - nominalMonthlyWithdrawal;
                }

                // Se o saldo ficar negativo, zerar
                if (balance < 0) {
                    balance = 0;
                }
                if (nominalBalance < 0) {
                    nominalBalance = 0;
                }

                balanceData.push(balance);
                nominalData.push(nominalBalance);
                investedData.push(totalInvested); // Mantém o total investido (não há mais aportes)
            }

            // Calcular retirada mensal após aposentadoria
            const annualWithdrawalAmount = balanceAtRetirement * withdrawalRate;
            const monthlyWithdrawalAmount = annualWithdrawalAmount / 12;

            // Obter renda mensal desejada
            const desiredIncome = parseFloat(document.getElementById('desiredIncome').value) || 0;

            // Atualizar labels dos cards com a idade de aposentadoria
            document.getElementById('labelTotalInvested').textContent = `Total Aportado aos ${retirementAge} anos`;
            document.getElementById('labelFinalBalance').textContent = `Patrimônio Final aos ${retirementAge} anos`;

            // Atualizar valores dos cards
            document.getElementById('totalInvested').textContent = formatCurrency(totalInvested);
            document.getElementById('monthlyWithdrawal').textContent = formatCurrency(monthlyWithdrawalAmount);
            document.getElementById('finalBalance').textContent = formatCurrency(balanceAtRetirement);

            // Comparar com renda desejada
            const comparisonEl = document.getElementById('incomeComparison');
            const cardWithdrawal = document.getElementById('cardWithdrawal');
            const diff = monthlyWithdrawalAmount - desiredIncome;
            const percentDiff = ((monthlyWithdrawalAmount / desiredIncome) * 100).toFixed(0);

            // Remover classes anteriores
            comparisonEl.classList.remove('success', 'warning', 'danger');
            cardWithdrawal.classList.remove('highlight');

            if (monthlyWithdrawalAmount >= desiredIncome) {
                comparisonEl.classList.add('success');
                cardWithdrawal.classList.add('highlight');
                comparisonEl.textContent = `${percentDiff}% da renda desejada (+${formatCurrency(diff)})`;
            } else if (percentDiff >= 80) {
                comparisonEl.classList.add('warning');
                comparisonEl.textContent = `${percentDiff}% da renda desejada (${formatCurrency(diff)})`;
            } else {
                comparisonEl.classList.add('danger');
                comparisonEl.textContent = `${percentDiff}% da renda desejada (${formatCurrency(diff)})`;
            }

            // Atualizar gráfico
            // Verificar se deve mostrar patrimônio nominal
            const showNominal = document.getElementById('showNominal').checked;

            updateChart(labels, balanceData, nominalData, investedData, retirementAge, showNominal);
        }

        // Atualizar ou criar gráfico
        function updateChart(labels, balanceData, nominalData, investedData, retirementAge, showNominal) {
            const ctx = document.getElementById('investmentChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            // Encontrar o índice da idade de aposentadoria
            const retirementIndex = labels.indexOf(retirementAge);

            // Criar datasets
            const datasets = [
                {
                    label: 'Patrimônio Real',
                    data: balanceData,
                    borderColor: '#00d4ff',
                    backgroundColor: 'rgba(0, 212, 255, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    borderWidth: 3
                },
                {
                    label: 'Total Aportado',
                    data: investedData,
                    borderColor: '#ff6b6b',
                    backgroundColor: 'rgba(255, 107, 107, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    borderWidth: 2,
                    borderDash: [5, 5]
                }
            ];

            // Adicionar patrimônio nominal se checkbox estiver marcado
            if (showNominal) {
                datasets.unshift({
                    label: 'Patrimônio Nominal',
                    data: nominalData,
                    borderColor: '#ffa500',
                    backgroundColor: 'rgba(255, 165, 0, 0.05)',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    borderWidth: 2,
                    borderDash: [3, 3]
                });
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#fff',
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                title: function(context) {
                                    const age = context[0].label;
                                    const phase = age < retirementAge ? 'Acumulação' : 'Aposentadoria';
                                    return `Idade: ${age} anos (${phase})`;
                                },
                                label: function(context) {
                                    return `${context.dataset.label}: ${formatCurrency(context.raw)}`;
                                }
                            }
                        },
                        annotation: {
                            annotations: {
                                retirementLine: {
                                    type: 'line',
                                    xMin: retirementIndex,
                                    xMax: retirementIndex,
                                    borderColor: '#ffd700',
                                    borderWidth: 2,
                                    borderDash: [6, 6],
                                    label: {
                                        display: true,
                                        content: 'Aposentadoria',
                                        position: 'start',
                                        backgroundColor: 'rgba(255, 215, 0, 0.8)',
                                        color: '#000',
                                        font: {
                                            size: 11
                                        }
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Idade',
                                color: '#888'
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 15
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Valor Real (R$)',
                                color: '#888'
                            },
                            ticks: {
                                color: '#888',
                                callback: function(value) {
                                    if (value >= 1000000) {
                                        return 'R$ ' + (value / 1000000).toFixed(1) + 'M';
                                    } else if (value >= 1000) {
                                        return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                                    }
                                    return 'R$ ' + value;
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        // Event listeners para atualização automática
        document.getElementById('inflationRate').addEventListener('input', updateRealReturn);
        document.getElementById('annualReturn').addEventListener('input', updateRealReturn);

        // Auto-calcular quando qualquer campo mudar
        const inputs = document.querySelectorAll('input:not([disabled])');
        inputs.forEach(input => {
            input.addEventListener('change', calculateProjection);
        });

        // Inicializar
        loadConfig(); // Carrega configuração salva se existir
        updateRealReturn();
        calculateProjection();
    </script>
</body>
